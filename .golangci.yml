run:
  timeout: 5m
  tests: true
  build-tags:
    - quic
  skip-dirs:
    - bin
    - docker
    - charts
    - ui
    - .cache
    - .github

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - prealloc
    - tparallel
    - thelper
    - errorlint
    - bodyclose
    - noctx
    - forcetypeassert
    - nilerr
    - gosec
    - sqlclosecheck

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  gosec:
    excludes:
      - G104
      - G306
  govet:
    enable:
      - nilness
      - shadow
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/darkinno/edge-dispatch-framework
  misspell:
    locale: US
  prealloc:
    simple: true
    range-loops: true
    for-loops: true
  errorlint:
    errorf: true
    asserts: true
    comparison: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - bodyclose
        - noctx
        - forcetypeassert
    - path: _test\.go
      text: "returns unexported type"
      linters:
        - govet
    - path: cmd/stress/
      linters:
        - errcheck
        - gosec
    - path: internal/tunnel/
      linters:
        - errcheck
    - path: internal/edgeagent/localconfig/
      linters:
        - errcheck
    - path: internal/autotls/
      linters:
        - errcheck
    - path: internal/contentindex/
      linters:
        - errcheck
  exclude-dirs:
    - bin
    - docker
    - charts
    - ui
    - .cache
    - .github
  max-issues-per-linter: 0
  max-same-issues: 0
