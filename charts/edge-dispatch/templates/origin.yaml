{{- if .Values.origin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-dispatch.fullname" . }}-origin
  labels:
    {{- include "edge-dispatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: origin
spec:
  replicas: {{ .Values.origin.replicas }}
  selector:
    matchLabels:
      {{- include "edge-dispatch.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: origin
  template:
    metadata:
      labels:
        {{- include "edge-dispatch.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: origin
    spec:
      containers:
        - name: origin
          image: "{{ .Values.origin.image.repository }}:{{ .Values.origin.image.tag }}"
          imagePullPolicy: {{ .Values.origin.image.pullPolicy }}
          command: ["/origin"]
          ports:
            - name: http
              containerPort: 7070
              protocol: TCP
          env:
            - name: ORIGIN_LISTEN_ADDR
              value: {{ .Values.origin.env.listenAddr | quote }}
            - name: ORIGIN_DATA_DIR
              value: {{ .Values.origin.env.dataDir | quote }}
          {{- if .Values.origin.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data/origin
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.origin.resources | nindent 12 }}
      {{- if .Values.origin.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "edge-dispatch.fullname" . }}-origin-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-dispatch.fullname" . }}-origin
  labels:
    {{- include "edge-dispatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: origin
spec:
  type: {{ .Values.origin.service.type }}
  ports:
    - name: http
      port: {{ .Values.origin.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "edge-dispatch.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: origin
{{- if .Values.origin.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "edge-dispatch.fullname" . }}-origin-data
  labels:
    {{- include "edge-dispatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: origin
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.origin.persistence.size }}
{{- end }}
{{- end }}
